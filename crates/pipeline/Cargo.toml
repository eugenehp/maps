[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
tilefmt = { path = "../tilefmt" }
brotli = "8"
flate2 = "1"
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-schema = "60"
bincode = "1"
byteorder = "1.5.0"
earcutr = "0.5.0"
geo = "0.33.1"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd", "snap"] }
rayon = "1.12.0"
rstar = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiff = "0.11.3"
ureq = "2"
calamine = "0.26"
regex = "1.13.1"
